apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-alarm-relay
  labels:
    app: twitch-alarm-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twitch-alarm-relay
  template:
    metadata:
      labels:
        app: twitch-alarm-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: relay
          image: ghcr.io/bronyatenei/twitch-alarm-server:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: twitch-alarm-secrets
          env:
            - name: DB_PATH
              value: /data/twitch-alarm.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: twitch-alarm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twitch-alarm-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
