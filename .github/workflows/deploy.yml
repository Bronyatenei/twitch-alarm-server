name: Build and deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bronyatenei/twitch-alarm-server
  NAMESPACE: twitch-alarm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Snapshot server load before deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
            set +e
            echo "=== time / uptime ==="
            date -Is
            uptime
            echo "=== memory / disk ==="
            free -h
            df -h /
            echo "=== load snapshot ==="
            top -b -n 1 -o %CPU | head -35
            echo "=== top processes by cpu ==="
            ps -eo pid,ppid,user,stat,pcpu,pmem,etime,comm,args --sort=-pcpu | head -35
            echo "=== k3s pod resource usage ==="
            export KUBECONFIG="${HOME}/.kube/config"
            kubectl top pods -A --sort-by=cpu 2>&1 || true
            echo "=== k3s node resource usage ==="
            kubectl top nodes 2>&1 || true
            echo "=== all pods and restarts ==="
            kubectl get pods -A -o wide 2>&1 || true
            echo "=== relay pod status ==="
            kubectl -n twitch-alarm get pod -l app=twitch-alarm-relay -o wide 2>&1 || true
            echo "=== recent cluster events ==="
            kubectl get events -A --sort-by=.lastTimestamp 2>&1 | tail -100 || true
          REMOTE

      - name: Deploy manifests and secrets to k3s
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          EVENTSUB_CALLBACK: ${{ secrets.EVENTSUB_CALLBACK }}
          EVENTSUB_SECRET: ${{ secrets.EVENTSUB_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${GITHUB_SHA}|g" deploy/k8s/deployment.yaml
          tar czf /tmp/k8s.tgz deploy/k8s
          scp /tmp/k8s.tgz "$SERVER_USER@$SERVER_HOST:/tmp/twitch-alarm-k8s.tgz"
          ssh "$SERVER_USER@$SERVER_HOST" 'set -eu
            rm -rf /tmp/twitch-alarm-k8s
            mkdir -p /tmp/twitch-alarm-k8s
            tar xzf /tmp/twitch-alarm-k8s.tgz -C /tmp/twitch-alarm-k8s
            export KUBECONFIG="$HOME/.kube/config"
            kubectl apply -f /tmp/twitch-alarm-k8s/deploy/k8s/namespace.yaml
          '
          printf '%s\n' \
            "TWITCH_CLIENT_ID=$TWITCH_CLIENT_ID" \
            "TWITCH_CLIENT_SECRET=$TWITCH_CLIENT_SECRET" \
            "EVENTSUB_CALLBACK=$EVENTSUB_CALLBACK" \
            "EVENTSUB_SECRET=$EVENTSUB_SECRET" \
            "ADMIN_API_KEY=$ADMIN_API_KEY" \
            > /tmp/twitch-alarm.env
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -w0 > /tmp/firebase-service-account.b64
          printf '{"data":{"FIREBASE_SERVICE_ACCOUNT_JSON":"%s"}}\n' "$(cat /tmp/firebase-service-account.b64)" > /tmp/firebase-secret-patch.json
          scp /tmp/twitch-alarm.env /tmp/firebase-service-account.b64 /tmp/firebase-secret-patch.json "$SERVER_USER@$SERVER_HOST:/tmp/"
          ssh "$SERVER_USER@$SERVER_HOST" "set -eu
            base64 -d /tmp/firebase-service-account.b64 > /tmp/firebase-service-account.json
            export KUBECONFIG=\"\$HOME/.kube/config\"
            kubectl -n $NAMESPACE create secret generic twitch-alarm-secrets --from-env-file=/tmp/twitch-alarm.env --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n $NAMESPACE patch secret twitch-alarm-secrets --type=merge --patch-file=/tmp/firebase-secret-patch.json
            kubectl -n $NAMESPACE create secret docker-registry ghcr-pull-secret --docker-server=ghcr.io --docker-username=\"$GHCR_USERNAME\" --docker-password=\"$GHCR_PULL_TOKEN\" --dry-run=client -o yaml | kubectl apply -f -
            rm -f /tmp/twitch-alarm.env /tmp/firebase-service-account.b64 /tmp/firebase-service-account.json /tmp/firebase-secret-patch.json
            kubectl -n $NAMESPACE apply -k /tmp/twitch-alarm-k8s/deploy/k8s
            if ! kubectl -n $NAMESPACE rollout status deployment/twitch-alarm-relay --timeout=180s; then
              echo "=== pods ==="
              kubectl -n $NAMESPACE get pods -o wide || true
              echo "=== deployment ==="
              kubectl -n $NAMESPACE describe deployment twitch-alarm-relay || true
              echo "=== pod descriptions ==="
              kubectl -n $NAMESPACE describe pods -l app=twitch-alarm-relay || true
              echo "=== recent events ==="
              kubectl -n $NAMESPACE get events --sort-by=.lastTimestamp | tail -100 || true
              echo "=== container logs ==="
              kubectl -n $NAMESPACE logs -l app=twitch-alarm-relay --all-containers --tail=200 --prefix || true
              echo "=== previous container logs ==="
              kubectl -n $NAMESPACE logs -l app=twitch-alarm-relay --all-containers --previous --tail=200 --prefix || true
              exit 1
            fi
          "
